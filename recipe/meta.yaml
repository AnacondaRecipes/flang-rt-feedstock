{% set version = "23.1.4" %}
{% set major = version.split(".")[0] %}
# test program for the intrinsic modules (no "::" so the lines stay plain YAML and shell/cmd safe)
{% set test_f90 = [
  "program t",
  "use iso_fortran_env",
  "use iso_c_binding",
  "implicit none",
  "integer(c_int) i",
  "real(real64) x",
  "i = 42",
  "x = real(i, c_double)",
  "if (int(x, int64) .ne. 42_int64) error stop 1",
  "print *, compiler_version()",
  "end program t",
] %}

package:
  name: flang-rt-split
  version: {{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-{{ version.replace(".rc", "-rc") }}.tar.gz
  sha256: 3e1c70b30f623976c2046d94b8eeab6cac536f107914cb4ed7bac572a03131db

build:
  number: 0
  # intentionally only windows (main target) & linux (debuggability)
  skip: true  # [osx]

requirements:
  build:
    - cmake
    - ninja-base
    # runtimes/CMakeLists.txt requires Python3
    - python
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - flang =={{ version }}
    # only to avoid pulling in newer rc's which have a different SONAME
    - libllvm{{ major }} =={{ version }}
  host:
    - clangdev =={{ version }}
    - compiler-rt =={{ version }}
    - llvmdev =={{ version }}
    - mlir =={{ version }}

outputs:
  - name: libflang-rt
    build:
      # not supported on windows yet, see
      # https://github.com/llvm/llvm-project/issues/134186
      skip: true  # [win]
    files:
      - lib/libflang_rt.runtime.so  # [linux]
    requirements:
      build:
        # for strong run-exports
        - {{ stdlib('c') }}
      run_constrained:
        # avoid old flang runtime
        - libflang <0.0a0
    test:
      commands:
        # shared library; copied from target-specific location
        - test -f $PREFIX/lib/libflang_rt.runtime.so    # [linux]

  - name: flang-rt_{{ target_platform }}
    build:
      noarch: generic
    files:
      - lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.a                # [linux64]
      - lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.so               # [linux64]
      - lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu/libflang_rt.runtime.a               # [aarch64]
      - lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu/libflang_rt.runtime.so              # [aarch64]
      # Fortran intrinsic modules (iso_fortran_env, iso_c_binding, ieee_*, ...); built by flang-rt since LLVM 23
      - lib/clang/{{ major }}/finclude/flang/x86_64-unknown-linux-gnu                           # [linux64]
      - lib/clang/{{ major }}/finclude/flang/aarch64-unknown-linux-gnu                          # [aarch64]
      - Library/lib/clang/{{ major }}/finclude/flang/x86_64-pc-windows-msvc                     # [win]
      # corresponding to different flavours of the MSVC runtime, i.e. `/MD`, `/MDd`, `/MT`, `/MTd`
      - Library/lib/clang/{{ major }}/lib/x86_64-pc-windows-msvc/flang_rt.runtime.static.lib    # [win]
      - Library/lib/clang/{{ major }}/lib/x86_64-pc-windows-msvc/flang_rt.runtime.dynamic.lib   # [win]
      - Library/lib/clang/{{ major }}/lib/x86_64-pc-windows-msvc/flang_rt.runtime.static_dbg.lib    # [win]
      - Library/lib/clang/{{ major }}/lib/x86_64-pc-windows-msvc/flang_rt.runtime.dynamic_dbg.lib   # [win]
    requirements:
      build:
        # for strong run-exports
        - {{ stdlib('c') }}     # [linux]
      host:
        - clangdev =={{ version }}
        - compiler-rt =={{ version }}
        - llvmdev =={{ version }}
        - mlir =={{ version }}
      run:
        - clang =={{ version }}
        - flang =={{ version }}
    test:
      requires:
        - {{ compiler('c') }}    # [linux]
      commands:
        # target-specific runtime library location (default for flang)
        - test -f $PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.a                      # [linux64]
        - test -f $PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.so                     # [linux64]
        - test -f $PREFIX/lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu/libflang_rt.runtime.a                     # [aarch64]
        - test -f $PREFIX/lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu/libflang_rt.runtime.so                    # [aarch64]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\x86_64-pc-windows-msvc\flang_rt.runtime.static.lib exit 1    # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\x86_64-pc-windows-msvc\flang_rt.runtime.dynamic.lib exit 1   # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\x86_64-pc-windows-msvc\flang_rt.runtime.static_dbg.lib exit 1    # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\x86_64-pc-windows-msvc\flang_rt.runtime.dynamic_dbg.lib exit 1   # [win]
        # intrinsic modules in flang's default search path (<resource dir>/finclude/flang/<triple>)
        {% for mod in ["iso_fortran_env", "iso_c_binding", "ieee_arithmetic", "ieee_exceptions", "__fortran_builtins"] %}
        - test -f $PREFIX/lib/clang/{{ major }}/finclude/flang/x86_64-unknown-linux-gnu/{{ mod }}.mod     # [linux64]
        - test -f $PREFIX/lib/clang/{{ major }}/finclude/flang/aarch64-unknown-linux-gnu/{{ mod }}.mod    # [aarch64]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\finclude\flang\x86_64-pc-windows-msvc\{{ mod }}.mod exit 1    # [win]
        {% endfor %}
        {% for line in test_f90 %}
        - echo '{{ line }}' >> test_modules.f90   # [unix]
        - echo {{ line }} >> test_modules.f90     # [win]
        {% endfor %}
        # flang finds the modules on its own, without -fintrinsic-modules-path
        - flang -c test_modules.f90 -o test_modules.o
        # link against the runtime from this package and run (Linux; Windows links through flang-activation)
        - ${CC} test_modules.o -L$PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu -Wl,-rpath,$PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu -lflang_rt.runtime -o test_modules    # [linux64]
        - ${CC} test_modules.o -L$PREFIX/lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu -Wl,-rpath,$PREFIX/lib/clang/{{ major }}/lib/aarch64-unknown-linux-gnu -lflang_rt.runtime -o test_modules   # [aarch64]
        - ./test_modules    # [linux]

about:
  home: https://flang.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_file: flang/LICENSE.TXT
  license_family: Apache
  summary: Flang runtime library for LLVM's Fortran compiler
  description: |
    flang-rt provides the Fortran runtime library for LLVM's Flang compiler.
    This runtime is required for executing Fortran programs compiled with Flang.
    In LLVM 21, the Fortran runtime was reorganized from libFortranRuntime to
    flang_rt.runtime, built using the LLVM_ENABLE_RUNTIMES mechanism.
  dev_url: https://github.com/llvm/llvm-project
  doc_url: https://flang.llvm.org/docs/

extra:
  recipe-maintainers:
    - conda-forge/flang
    - h-vetinari
